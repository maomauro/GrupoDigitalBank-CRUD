# Vhost de este proyecto para el nginx COMPARTIDO del VPS (contenedor portalcv-nginx-prod, que ya atiende 80/443).
#
# Fuente de verdad: este archivo se copia a docker/gdb-crud.conf en el repositorio Curriculum-Vitae-Web y se monta
# en /etc/nginx/conf.d/gdb-crud.conf (ver docs/plan-de-trabajo.md, 6.6 y ADR 0011). En desarrollo, el servicio "borde"
# del compose de desarrollo lo usa TAL CUAL (solo cambia server_name por "_") para probar la misma cadena
# nginx -> Caddy -> aplicacion antes de desplegar.
#
# El proyecto no publica puertos: este nginx lo alcanza por la red compartida con el alias "gdb-crud-web". El
# certificado de origen de Cloudflare va en /etc/nginx/ssl (carpeta del host, ya montada en ese contenedor).

server {
    listen 80;
    server_name gdb-crud.sitiosapps.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gdb-crud.sitiosapps.com;

    ssl_certificate     /etc/nginx/ssl/gdb-crud.sitiosapps.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gdb-crud.sitiosapps.com.key;

    # Sin Strict-Transport-Security aqui: lo agrega el Caddyfile (ADR 0009). Duplicarlo repetiria la cabecera.

    # No revelar la version de nginx (el Server lo pone este proxy, no Caddy)
    server_tokens off;

    client_max_body_size 1m;

    # IMPORTANTE: el nombre se resuelve en cada peticion (resolver de Docker), no al arrancar. Con un proxy_pass
    # fijo, si el contenedor gdb-crud-web no existe cuando nginx arranca o recarga, nginx NO inicia y se caen tambien
    # PortalCV y Colfe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gdb_crud_upstream http://gdb-crud-web:80;

    location / {
        proxy_pass $gdb_crud_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Con Cloudflare delante, la IP real del cliente llega en CF-Connecting-IP
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
