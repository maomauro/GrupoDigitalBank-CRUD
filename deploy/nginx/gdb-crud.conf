# Replica de DESARROLLO y de PRUEBA del vhost de este proyecto. En produccion el vhost vive en el repositorio del
# gateway de plataforma (sitiosapps-gateway, nginx/conf.d/gdb-crud.conf, ADR 0014), que ademas exige el certificado
# de cliente de Cloudflare y limita la tasa de peticiones; esos dos detalles no estan aqui a proposito.
#
# El servicio "borde" del compose de desarrollo y scripts/probar-despliegue.sh lo usan (solo cambia server_name por
# "_" en desarrollo) para probar la misma cadena nginx -> Caddy -> aplicacion antes de desplegar.
#
# El proyecto no publica puertos: el nginx lo alcanza por la red compartida con el alias "gdb-crud-web".

server {
    listen 80;
    server_name gdb-crud.sitiosapps.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gdb-crud.sitiosapps.com;

    ssl_certificate     /etc/nginx/ssl/gdb-crud.sitiosapps.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gdb-crud.sitiosapps.com.key;

    # Sin Strict-Transport-Security aqui: lo agrega el Caddyfile (ADR 0009). Duplicarlo repetiria la cabecera.

    # No revelar la version de nginx (el Server lo pone este proxy, no Caddy)
    server_tokens off;

    client_max_body_size 1m;

    # IMPORTANTE: el nombre se resuelve en cada peticion (resolver de Docker), no al arrancar. Con un proxy_pass
    # fijo, si el contenedor gdb-crud-web no existe cuando nginx arranca o recarga, nginx NO inicia y se caen tambien
    # PortalCV y Colfe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gdb_crud_upstream http://gdb-crud-web:80;

    location / {
        proxy_pass $gdb_crud_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Con Cloudflare delante, la IP real del cliente llega en CF-Connecting-IP
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
