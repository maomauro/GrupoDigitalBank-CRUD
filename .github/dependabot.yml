version: 2

# Actualizaciones semanales hacia develop. Los PR llevan el prefijo "build(deps)" (Conventional Commits).
#
# GitHub Actions (package-ecosystem: "github-actions", directory: "/", prefijo "ci") NO esta incluido a proposito:
# Dependabot falla con "/action.yml or /.github/workflows/<anything>.yml not found" mientras el repositorio no tenga
# workflows. Agregarlo cuando exista .github/workflows/ci.yml (fase 5, issue #20).
updates:
  # Paquetes NuGet (versiones centralizadas en Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      corewcf:
        patterns: ["CoreWCF.*"]
      pruebas:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "NSubstitute"
          - "Shouldly"
          - "Testcontainers*"

  # Imagenes base de los Dockerfile (una entrada por carpeta con Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/src/GrupoDigitalBank.Negocios"
      - "/src/GrupoDigitalBank.Presentacion"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # El salto de version mayor de .NET se decide a mano (LTS vigente: .NET 10)
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]

  # Imagenes de docker-compose.yml (postgres y caddy)
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # PostgreSQL mayor exige pg_dump y restauracion planificada (ver plan, fase 9.3)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Herramienta opcional de navegador (puppeteer-core, scripts/probar-navegador.ps1)
  - package-ecosystem: "npm"
    directory: "/scripts/navegador"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
