services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica los scripts db/NNN_*.sql pendientes y termina (ver db/migrate.sh). Si falla, negocios no arranca.
  migrador:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["sh", "/migraciones/migrate.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?Define APP_DB_USER en .env (rol de la aplicacion)}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    volumes:
      - ./db:/migraciones:ro
    depends_on:
      db:
        condition: service_healthy

  negocios:
    build:
      context: .
      dockerfile: src/GrupoDigitalBank.Negocios/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER:?Define APP_DB_USER en .env};Password=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    depends_on:
      migrador:
        condition: service_completed_successfully
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: src/GrupoDigitalBank.Presentacion/Dockerfile
    restart: unless-stopped
    environment:
      Negocios__Url: http://negocios:8080/UsuarioService.svc
    depends_on:
      - negocios
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
